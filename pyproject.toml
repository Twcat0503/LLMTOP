[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llmtop"
version = "0.1.0"
description = "A shared TUI and Web monitor for self-hosted LLM inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LLMTOP contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.21,<1",
    "psutil>=6.1,<8",
    "pydantic>=2.10,<3",
    "rich>=13.9,<15",
    "textual>=2,<8",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12"]
dev = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[project.scripts]
llmtop = "llmtop.cli:main"

[tool.hatch.build]
exclude = [
    "/.cache", "/.bootstrap", "/.venv", "/.remote", "/.tools", "/.tmp",
    "/artifacts", "/dist", "/logs", "/data", "/llmtop", "/llmtop.toml",
    "**/*.local.toml", "**/__pycache__", "**/node_modules", "**/.env",
    "/AGENTS.md", "/docs/TEST-ENVIRONMENT.md", "/docs/M1-VALIDATION.md",
    "/docs/PROTOTYPE-AUDIT.md", "/docs/*-LOCAL.md", "/.release-private-patterns",
    "/docs/design",
    "/source-manifest.json", "/.llmtop-task", "**/*.pem", "**/*.key", "**/*.pub",
    "**/*.log", "**/test-results", "**/playwright-report", "**/.pytest_cache",
    "**/.ruff_cache", "**/*.tsbuildinfo",
]

[tool.hatch.build.targets.sdist]
artifacts = ["/src/llmtop/web_static/**"]
include = [
    "/src", "/tests", "/scripts", "/frontend", "/examples", "/docs",
    "/.github", "/.editorconfig", "/.gitattributes", "/.gitignore", "/README.md", "/LICENSE",
    "/CONTRIBUTING.md", "/CHANGELOG.md", "/SECURITY.md", "/pyproject.toml", "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmtop"]
artifacts = ["/src/llmtop/web_static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
